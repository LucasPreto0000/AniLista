name: Compilar AniLista para Windows
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-windows.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Obter os arquivos deste commit
        shell: pwsh
        run: |
          $files = @("source/AniLista.cs", "source/InteractionTests.cs", "source/app.manifest", "AniLista.ico")
          foreach ($file in $files) {
            $parent = Split-Path $file -Parent
            if ($parent) { New-Item -ItemType Directory -Force $parent | Out-Null }
            $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/${file}?ref=$env:GITHUB_SHA" --jq .content
            if ($LASTEXITCODE -ne 0) { throw "Falha ao obter $file" }
            [IO.File]::WriteAllBytes((Join-Path $PWD $file), [Convert]::FromBase64String(($encoded -join "")))
          }
      - name: Compilar aplicativo e testes
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:AniLista.exe /win32icon:AniLista.ico /win32manifest:source/app.manifest /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Net.Http.dll /r:System.Runtime.Serialization.dll /r:System.Web.Extensions.dll source/AniLista.cs
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar AniLista.exe" }
          & $csc /nologo /target:exe /out:InteractionTests.exe /r:AniLista.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll source/InteractionTests.cs
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar testes" }
      - name: Verificar interações e persistência
        shell: pwsh
        run: |
          & .\InteractionTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }
          if ((Get-Item AniLista.exe).Length -le 0) { throw "Executável vazio" }
          Get-FileHash AniLista.exe -Algorithm SHA256
      - name: Publicar somente o executável na release
        shell: pwsh
        run: |
          gh release upload v1.0.0 AniLista.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar executável" }
          $assets = gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Falha ao conferir anexos" }
          if ($assets -contains "AniLista.zip") {
            gh release delete-asset v1.0.0 AniLista.zip --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw "Falha ao remover ZIP" }
          }
          $notes = @"
          Primeira publicação do AniLista para Windows.

          Baixe **AniLista.exe** abaixo e abra com dois cliques.

          - Biblioteca com listas Quero assistir, Assistindo e Concluídos.
          - Busca no catálogo da AniList, capas e acompanhamento de episódios.
          - Salvamento automático e cadastro manual offline.

          Requer Windows com .NET Framework 4.8. Consulte o README do repositório para instruções.
          "@
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release edit v1.0.0 --repo $env:GITHUB_REPOSITORY --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar notas" }
